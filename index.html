<!DOCTYPE html>
<html>
<body>
  <h2>Image Resizer</h2>
  <input type="file" id="file" accept="image/*"><br><br>
  Width <input type="number" id="w" value="300">
  Height <input type="number" id="h" value="300">
  <select id="fmt"><option>JPEG</option><option>PNG</option><option>WEBP</option></select>
  <button onclick="go()">Resize</button>
  <p id="info"></p>
  <img id="out"><br>
  <a id="dl" download="resized">Download</a>

<script>
const URL_ = "https://ytfif5g5deer5cwtvye2gmn7pm0sirqm.lambda-url.ap-southeast-2.on.aws/";
function go() {
  const f = document.getElementById("file").files[0];
  if (!f) return alert("Pick an image");
  const r = new FileReader();
  r.onload = async () => {
    const res = await fetch(URL_, {
      method: "POST",
      body: JSON.stringify({
        image: r.result.split(",")[1],
        width: +w.value, height: +h.value, format: fmt.value })
    });
    const d = await res.json();
    if (d.error) return info.innerText = d.error;
    const src = `data:image/${d.format.toLowerCase()};base64,${d.image}`;
    out.src = src; dl.href = src;
    info.innerText = `New size: ${d.size[0]} x ${d.size[1]}`;
  };
  r.readAsDataURL(f);
}
</script>
</body>
</html>
